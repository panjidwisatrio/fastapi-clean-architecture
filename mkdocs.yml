site_name: FastAPI Clean Architecture
site_description: A modern, production-ready web application template built with FastAPI following clean architecture principles
site_author: Panji Satrio
site_url: https://panjidwisatrio.github.io/fastapi-clean-architecture/

# Repository
repo_name: fastapi-clean-architecture
repo_url: https://github.com/panjidwisatrio/fastapi-clean-architecture
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 Panji Satrio

# Configuration
theme:
  name: material
  language: en
  
  # Color scheme
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Features
  features:
    - navigation.instant      # Instant loading
    - navigation.tracking     # URL tracking
    - navigation.tabs         # Top-level tabs
    - navigation.tabs.sticky  # Sticky tabs
    - navigation.sections     # Section index pages
    - navigation.expand       # Expand sections by default
    - navigation.top          # Back to top button
    - navigation.footer       # Footer navigation
    - search.suggest          # Search suggestions
    - search.highlight        # Highlight search terms
    - search.share           # Share search results
    - content.code.copy      # Copy code button
    - content.code.annotate  # Code annotations
  
  # Icons
  icon:
    repo: fontawesome/brands/github
    logo: material/api
  
  # Favicon
  favicon: assets/favicon.png

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS and JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/panjidwisatrio
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/panji-satrio-3a2b18207
  
  version:
    provider: mike

